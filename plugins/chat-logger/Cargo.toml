[package]
name = "chat-logger"
version = "0.1.0"
edition = "2024"

[target.'cfg(not(windows))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dependencies]
anyhow = "1.0.100"
data-client = { version = "0.1.0", path = "../../libs/data-client" }
kovi.workspace = true
once_cell = "1.21.3"
reqwest = { version = "0.12.24", features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1", features = ["fs", "io-util"] }
toml = "0.9.8"
tracing = "0.1.41"
