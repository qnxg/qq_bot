[package]
name = "feedback"
version = "0.1.0"
edition = "2024"

[target.'cfg(not(windows))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
data-client = { version = "0.1.0", path = "../../libs/data-client" }
kovi.workspace = true
lapin = { version = "3.7.0", features = ["rustls"] }
once_cell = "1.21.3"
serde = "1.0.228"
serde_json = "1.0.145"
toml = "0.9.8"
tracing = "0.1.41"
